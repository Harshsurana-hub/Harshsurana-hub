name: Refresh pixel profile stats
on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/profile-stats.yml
permissions:
  contents: write
concurrency:
  group: pixel-profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Render public GitHub stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py
      - name: Publish updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/overview.svg assets/streak.svg assets/languages.svg assets/activity.svg assets/public-stats.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh public pixel profile stats"
          git pull --rebase origin main
          git push origin HEAD:main
